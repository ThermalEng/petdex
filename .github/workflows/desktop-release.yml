name: petdex-desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. desktop-v0.1.0)"
        required: true

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            zig_target: ""
          - target: darwin-x64
            runner: macos-14
            zig_target: x86_64-macos

    steps:
      - name: Checkout petdex
        uses: actions/checkout@v7
        with:
          # Manual workflow_dispatch must build from inputs.tag, not from
          # the branch the workflow file lives on. Tag pushes already
          # arrive with github.ref pointing at the tag.
          ref: ${{ inputs.tag || github.ref }}

      - name: Clone zero-native
        # build.zig resolves zero-native from -Dzero-native-path flag, the
        # ZERO_NATIVE_PATH env var, or ../../zero-native (in that order).
        # CI passes the checkout path explicitly via the env var so we
        # don't have to patch build.zig at runtime.
        #
        # Source defaults to Railly/zero-native:feature/window-resize because
        # the floating-window options + window.resize + focusable flag aren't
        # in vercel-labs/main yet. Pin the commit so a mutable fork branch
        # cannot silently produce a desktop release without window.resize.
        # Update ZERO_NATIVE_REMOTE / ZERO_NATIVE_BRANCH / ZERO_NATIVE_REF once
        # everything merges upstream so CI can switch to vercel-labs/main.
        env:
          ZERO_NATIVE_REMOTE: "https://github.com/Railly/zero-native.git"
          ZERO_NATIVE_BRANCH: "feature/window-resize"
          ZERO_NATIVE_REF: "c85ec92a170c5b1304543ffcbf0c1d6d3e413498"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$ZERO_NATIVE_BRANCH" "$ZERO_NATIVE_REMOTE" "$GITHUB_WORKSPACE/zero-native"
          git -C "$GITHUB_WORKSPACE/zero-native" fetch --depth 1 origin "$ZERO_NATIVE_REF"
          git -C "$GITHUB_WORKSPACE/zero-native" checkout --detach "$ZERO_NATIVE_REF"
          echo "ZERO_NATIVE_PATH=$GITHUB_WORKSPACE/zero-native/" >> "$GITHUB_ENV"

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build petdex-desktop
        working-directory: packages/petdex-desktop
        run: |
          zig_target_arg=""
          if [ -n "${{ matrix.zig_target }}" ]; then
            zig_target_arg="-Dtarget=${{ matrix.zig_target }}"
          fi
          zig build -Doptimize=ReleaseSafe $zig_target_arg -Dzero-native-path="$ZERO_NATIVE_PATH"
          mv zig-out/bin/petdex-desktop "petdex-desktop-${{ matrix.target }}"
          ls -lh "petdex-desktop-${{ matrix.target }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: petdex-desktop-${{ matrix.target }}
          path: packages/petdex-desktop/petdex-desktop-${{ matrix.target }}

  build-native:
    name: build native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14

    steps:
      - name: Checkout petdex
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Clone the Native SDK
        # petdex-desktop-native needs the floating/transparent/click_through
        # window options and fx.focusWindow, none of which are in
        # vercel-labs/main yet. Pinned by commit for the same reason the
        # zero-native clone above is: a mutable fork branch must not be able
        # to change what a tagged release contains. Point NATIVE_SDK_REMOTE
        # and NATIVE_SDK_REF at vercel-labs/main once those land upstream.
        env:
          NATIVE_SDK_REMOTE: "https://github.com/Railly/native.git"
          NATIVE_SDK_BRANCH: "feat/floating-window-0.5.3"
          NATIVE_SDK_REF: "b414704da8ff1aa3b9caa11d4db6a72eca47f717"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$NATIVE_SDK_BRANCH" "$NATIVE_SDK_REMOTE" "$GITHUB_WORKSPACE/native-sdk"
          git -C "$GITHUB_WORKSPACE/native-sdk" fetch --depth 1 origin "$NATIVE_SDK_REF"
          git -C "$GITHUB_WORKSPACE/native-sdk" checkout --detach "$NATIVE_SDK_REF"
          echo "NATIVE_SDK_PATH=$GITHUB_WORKSPACE/native-sdk" >> "$GITHUB_ENV"

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build the native CLI from the pinned SDK
        # The published @native-sdk/cli carries its own manifest parser, and
        # the released one rejects app.zon's `.floating` with a bare
        # ParseZon. Building the CLI from the same commit as the SDK keeps
        # the parser and the runtime in step.
        working-directory: ${{ env.NATIVE_SDK_PATH }}
        run: |
          zig build cli
          echo "NATIVE_CLI=$NATIVE_SDK_PATH/zig-out/bin/native" >> "$GITHUB_ENV"

      - name: Build petdex-desktop-native
        working-directory: packages/petdex-desktop-native
        run: |
          "$NATIVE_CLI" build
          ls -lh zig-out/bin/petdex-desktop-native

      - name: Package the app bundle
        working-directory: packages/petdex-desktop-native
        run: |
          "$NATIVE_CLI" package \
            --target macos \
            --binary zig-out/bin/petdex-desktop-native \
            --output "Petdex.app" \
            --signing adhoc
          # The agent logos and the pet atlas are read from
          # Contents/Resources at runtime, so a bundle that lost them
          # launches with blank rows instead of failing loudly.
          test -f "Petdex.app/Contents/Resources/assets/agents/claude-code.png"
          ditto -c -k --keepParent "Petdex.app" "petdex-desktop-native-${{ matrix.target }}.zip"
          ls -lh "petdex-desktop-native-${{ matrix.target }}.zip"

      - name: Upload native bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: petdex-desktop-native-${{ matrix.target }}
          path: packages/petdex-desktop-native/petdex-desktop-native-${{ matrix.target }}.zip

  sidecar:
    name: build sidecar (server.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout petdex
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Build sidecar
        working-directory: packages/petdex-desktop/sidecar
        run: |
          bun install --frozen-lockfile || bun install
          bun run build
          ls -lh server.js

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: petdex-desktop-sidecar
          path: packages/petdex-desktop/sidecar/server.js

  build-windows:
    name: build win32-x64
    runs-on: windows-2022
    steps:
      - name: Checkout petdex
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust stable (x86_64-pc-windows-msvc)
        # windows-2022 ships with Rust but pinning the toolchain + target
        # makes the job reproducible across runner image updates.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust/Cargo build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/petdex-desktop-windows/src-tauri -> target

      - name: Install Tauri CLI
        # Install into the local cargo bin so the version is locked to what
        # tauri.conf.json declares, not whatever the runner image happens to
        # have. `--locked` ensures Cargo.lock is respected.
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build petdex-desktop-win32-x64.exe
        # `--no-bundle` skips NSIS/WiX installer generation (we ship the
        # bare .exe per the CLI asset contract). `--bundles none` was
        # removed in tauri-cli 2.x; `--no-bundle` is the correct flag.
        # The binary name is driven by the [[bin]] entry in Cargo.toml.
        working-directory: packages/petdex-desktop-windows
        run: |
          cargo tauri build --no-bundle
          $exe = "src-tauri\target\release\petdex-desktop-win32-x64.exe"
          if (-not (Test-Path $exe)) { throw "Binary not found at $exe" }
          Write-Output "Binary size: $((Get-Item $exe).Length) bytes"
          Copy-Item $exe "petdex-desktop-win32-x64.exe"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: petdex-desktop-win32-x64
          path: packages/petdex-desktop-windows/petdex-desktop-win32-x64.exe

  release:
    name: publish github release
    needs: [build, build-native, build-windows, sidecar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout petdex
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release
          find artifacts -type f -name "petdex-desktop-*" -exec cp {} release/ \;
          if [ -f artifacts/petdex-desktop-sidecar/server.js ]; then
            cp artifacts/petdex-desktop-sidecar/server.js release/petdex-desktop-sidecar.js
          fi
          test -f release/petdex-desktop-sidecar.js
          test -f release/petdex-desktop-darwin-arm64
          test -f release/petdex-desktop-darwin-x64
          test -f release/petdex-desktop-win32-x64.exe
          test -f release/petdex-desktop-native-darwin-arm64.zip
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # `inputs.tag` is set on workflow_dispatch (manual run); on push of
          # a desktop-v* tag, `github.ref_name` carries the tag. The
          # `inputs.tag || github.ref_name` order works because `inputs.tag`
          # is null on tag pushes.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/*
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-rc') }}
